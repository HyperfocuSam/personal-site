# This workflow will do a clean install of node dependencies, build the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: Node.js CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    # Cross-platform lint keeps a cheap signal for platform-specific eslint
    # plugin issues. Fast enough (<1min each) to justify 3 OSes.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - run: npm ci
      - name: Lint
        run: npm run lint

  build:
    # Deploy-to-Pages ships from ubuntu-latest, so that is the only platform
    # that actually matters for catching deploy-breaking bugs. Dropped
    # ubuntu-20.04 (runner deprecated and no longer allocated), dropped
    # Node 16.x + 18.x (both EOL), dropped windows-latest and macos-latest
    # from build (slow, prone to 10-min timeouts on react-snap, and
    # duplicates what deploy-to-pages already verifies).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        node-version: [20.x]
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
      - run: npm ci
      - name: Build and Statically Render
        shell: bash
        run: |
          function retry {
            local n=1
            local max=5
            local delay=1
            while true; do
              "$@" && break || {
                if [[ $n -lt $max ]]; then
                  ((n++))
                  echo "Command failed. Attempt $n/$max:"
                  sleep $delay;
                else
                  echo "The command has failed after $n attempts."
                  return 1
                fi
              }
            done
          }
          retry npm run predeploy
        env:
          NODE_ENV: development
      - name: Test
        run: npm test
        env:
          NODE_ENV: development

      - name: Lighthouse CI
        # Baseline performance + a11y + SEO budget. Asserts in lighthouserc.json.
        # Uploads HTML reports to temporary-public-storage (7-day retention).
        # warn-only on perf so a slow runner doesn't block deploys; error on
        # a11y + CLS + SEO (those are deterministic).
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./lighthouserc.json
        continue-on-error: true

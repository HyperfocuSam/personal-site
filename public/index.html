    <!-- THE CSP LIVES IN vercel.json, NOT HERE. Do not re-add a meta copy.

         A meta CSP and a header CSP are enforced together as an INTERSECTION,
         so two copies mean an origin has to be added to both or it is blocked
         by whichever one forgot it — with no error anyone would notice. That
         exact failure ran from 2026-05-15 to 2026-08-11: formspree.io was
         missing from connect-src and the contact form's fetch was refused for
         88 days. Fifteen people submitted three to six times each in that
         window and every one of them was thrown away. The meta tag was kept
         through the Vercel cutover only until the header was proven, and this
         is that retirement (2026-08-12).

         Adding a conversion integration means editing `headers` in
         vercel.json and verifying against the LIVE URL:
             curl -sI https://hyperfocusam.com/contact/ | grep -i content-security-policy
         `src/__tests__/conversionOrigins.test.js` fails the build if
         formspree.io or ro.am ever leaves that policy. -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />
